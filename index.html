<!doctype html>
<html lang="zh-CN" class="no-js" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>JDZone — Joint Discovery Zone</title>
    <meta
      name="description"
      content="JDZone（Joint Discovery Zone）是三个人组成的软件工程小组。探索、构建、超越：从定义问题到上线交付，保持同一套标准。"
    />
    <meta name="author" content="JDZone" />
    <!-- 由内联脚本与 useTheme 共同更新，跟随手动主题而不是只跟随系统 -->
    <meta name="theme-color" content="#05080C" />

    <!-- 社交分享卡片：替换 public/og.jpg 即可更新预览图 -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="JDZone" />
    <meta property="og:title" content="JDZone — Explore. Create. Beyond." />
    <meta
      property="og:description"
      content="三个人，一个标准。JDZone 是专注软件工程实践的三人小组，从问题定义到上线交付。"
    />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:alt" content="JDZone：电影感科幻城市主视觉，Joint Discovery Zone。" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 首屏展示字：很小的 woff2，提前取，避免大标题先闪回退字体 -->
    <link
      rel="preload"
      href="/fonts/jdz-sector.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <!--
      在样式加载前确定主题，避免浅色页面闪一下再变深色（FOUC）。
      这段脚本必须保持内联，并且尽量短。
    -->
    <script>
      ;(function () {
        /* 入场动画只在 JS 可用时启用；无 JS 时内容直接可见 */
        document.documentElement.classList.remove('no-js')
        document.documentElement.classList.add('js')

        try {
          var saved = localStorage.getItem('jdz-theme')
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme

          var themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) {
            themeColor.setAttribute('content', theme === 'dark' ? '#05080C' : '#EEF1F2')
          }
        } catch (error) {
          /* 隐私模式下 localStorage 可能不可用，保持默认深色即可 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>

    <!--
      无 JS 时的兜底内容：静态托管环境下依然能被搜索引擎与读屏软件读到核心信息。
      Vue 挂载后会接管 #app，这里的内容不再显示。
    -->
    <noscript>
      <div style="max-width: 720px; margin: 64px auto; padding: 0 24px; font-family: system-ui, sans-serif; line-height: 1.8">
        <h1>JDZone · Joint Discovery Zone</h1>
        <p>三个人，一个标准。JDZone 是专注软件工程实践的三人小组，从问题定义到上线交付。</p>
        <p>
          成员：zeionl（ENGINEERING）、Dreverie（PRODUCT &amp; UX）、jeffrey（DEVELOPMENT）。
        </p>
        <p>本站需要启用 JavaScript 才能查看完整内容。</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
